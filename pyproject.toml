[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-prompts"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "pydantic==2.11.7",
    "pyyaml==6.0.2",
    "jinja2==3.1.6",
    "numpy==2.4.6",
    "sqlalchemy==2.0.50",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.4",
    "mlflow==3.12.0",               # REG-10 — MLflow tracking;    released 2026-05-05 (>14d)
    "aiokafka==0.14.0",             # POL-3 — Kafka shadow source;  released 2026-04-29 (>14d)
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.11.13",
    "pyright==1.1.391",
]

[project.scripts]
lint-schemas = "atlas_prompts.lint:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_prompts*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["atlas_prompts", "evals", "eval_runs", "scripts", "tests", "gate.py"]
# Resolve imports against the local venv (matches the other Python repos) so
# typed deps like mlflow (ships py.typed) resolve instead of reading as missing.
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

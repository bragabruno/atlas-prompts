# Bitbucket Pipelines — atlas-prompts (INF-2 Gate 1 + Gate 2, XCUT-4, XCUT-6).
#
# Gate 1 (Correctness): ruff -> pyright --strict -> pytest (offline, zero API spend)
#                        + prompt/agent schema lint.
# Gate 2 (Quality):      eval regression gate (gate.py) — runs only when
#                        prompts/**, agents/**, or evals/** change.
# XCUT-4: dep_audit.py fails on any unpinned / <14-day-old dependency.
# XCUT-6: validate_diagrams.sh validates Mermaid + PlantUML diagrams.
#
# Image pinned exactly (atlas-docs/02 §2). The eval runner authenticates to the
# gateway + MLflow via OIDC / repo secrets referenced by NAME only (no values).

image: python:3.12.13-slim-bookworm  # 3.12.13 (2026-03-03)

definitions:
  caches:
    pip-cache: ~/.cache/pip

  steps:
    - step: &dep-audit
        name: "XCUT-4 — Dependency + age audit"
        caches: [pip-cache]
        script:
          - python scripts/dep_audit.py --min-age-days 14

    - step: &lint-typecheck
        name: "Gate 1a — Lint, Typecheck & Schema lint"
        caches: [pip-cache]
        script:
          - pip install --quiet -e ".[dev]"
          - ruff check .
          - ruff format --check .
          - pyright
          # Prompt/agent schema lint (INF-1) — also enforced in CI.
          - python scripts/lint_schemas.py

    - step: &unit-tests
        name: "Gate 1b — Unit Tests (zero API spend)"
        caches: [pip-cache]
        script:
          - pip install --quiet -e ".[dev]"
          - pytest -q

    - step: &eval-gate
        name: "Gate 2 — Eval Quality Gate"
        caches: [pip-cache]
        script:
          - pip install --quiet -e ".[dev]"
          # The eval runner (REG-8) produces a candidate run; gate.py (REG-11)
          # compares it to the production baseline and exits 1 on regression.
          # CANDIDATE_RUN_ID / BASELINE_EVAL_RUN_ID are repo pipeline variables
          # (referenced by name only — no secret values in this file).
          # MLFLOW_TRACKING_URI / gateway auth use OIDC / named repo secrets.
          - python -m evals.runner.runner
              --golden-set "gs://atlas-golden-sets/v${GOLDEN_SET_VERSION}"
              --mlflow-uri "${MLFLOW_TRACKING_URI}"
              --output-run-id "${CANDIDATE_RUN_ID}"
          - python gate.py "${CANDIDATE_RUN_ID}" "${BASELINE_EVAL_RUN_ID}"

    - step: &diagram-validation
        name: "XCUT-6 — Diagram validation"
        image: node:22.22.2-bookworm-slim  # 22.22.2 (2026-03-24)
        script:
          # JRE for PlantUML + Chromium deps for mermaid-cli headless render.
          - apt-get update && apt-get install -y --no-install-recommends
              default-jre-headless chromium fonts-liberation
          # Pinned PlantUML jar (1.2026.3, 2026-05-08) from the GitHub release.
          - export PLANTUML_VERSION=1.2026.3
          - curl -fsSL -o /tmp/plantuml.jar
              "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          - export PLANTUML_JAR=/tmp/plantuml.jar
          # mermaid-cli (11.14.0) runs headless via the system Chromium.
          - export PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
          - printf '{"args":["--no-sandbox"]}' > /tmp/puppeteer.json
          - export PUPPETEER_CONFIG=/tmp/puppeteer.json
          - bash scripts/validate_diagrams.sh docs/diagrams

pipelines:
  pull-requests:
    "**":
      - parallel:
          - step: *dep-audit
          - step: *lint-typecheck
          - step: *unit-tests
          - step: *diagram-validation
      # Gate 2 — runs only when prompts/agents/evals change (required check).
      - step:
          <<: *eval-gate
          condition:
            changesets:
              includePaths:
                - "prompts/**"
                - "agents/**"
                - "evals/**"
